<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Podping Gossip Watcher</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-base:#0d1117;--bg-surface:#161b22;--bg-card:#1c2128;--bg-hover:#21262d;
  --border:#30363d;--border-light:#444c56;
  --text-primary:#e6edf3;--text-secondary:#8b949e;--text-muted:#484f58;
  --green:#3fb950;--yellow:#d29922;--red:#f85149;--blue:#58a6ff;
  --purple:#bc8cff;--cyan:#39d2c0;--orange:#db6d28;
  --font-body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-mono:'JetBrains Mono','Fira Code','Cascadia Code','SF Mono',Consolas,monospace;
}
html{font-size:16px}
body{background:var(--bg-base);color:var(--text-primary);font-family:var(--font-body);
  line-height:1.5;min-height:100vh;overflow-x:hidden}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}

header{
  background:var(--bg-surface);border-bottom:1px solid var(--border);
  padding:0.75rem 1.25rem;display:flex;align-items:center;gap:1rem;
  position:sticky;top:0;z-index:100;flex-wrap:wrap;
}
.logo{display:flex;align-items:center;gap:0.5rem;flex-shrink:0}
.logo svg{width:28px;height:28px}
.logo h1{font-size:1.1rem;font-weight:600;white-space:nowrap}
.logo .version{color:var(--text-muted);font-size:0.8rem;font-weight:400}
.header-meta{display:flex;gap:1rem;align-items:center;flex-wrap:wrap;
  margin-left:auto;font-size:0.8rem;color:var(--text-secondary);font-family:var(--font-mono)}
.conn-status{display:flex;align-items:center;gap:0.35rem}
.conn-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.conn-dot.ok{background:var(--green);box-shadow:0 0 6px var(--green)}
.conn-dot.err{background:var(--red);box-shadow:0 0 6px var(--red)}
.conn-dot.connecting{background:var(--yellow);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}

.layout{display:grid;grid-template-columns:280px 1fr;gap:0;min-height:calc(100vh - 52px)}
@media(max-width:768px){.layout{grid-template-columns:1fr}.sidebar{border-right:none;border-bottom:1px solid var(--border)}}

.sidebar{background:var(--bg-surface);border-right:1px solid var(--border);
  padding:1rem;display:flex;flex-direction:column;gap:1rem;overflow-y:auto}
.panel{background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:0.85rem}
.panel-title{font-size:0.7rem;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;
  color:var(--text-muted);margin-bottom:0.6rem}

.health-status{display:flex;align-items:center;gap:0.5rem;margin-bottom:0.65rem}
.health-badge{font-size:0.85rem;font-weight:700;padding:0.15rem 0.6rem;border-radius:4px;font-family:var(--font-mono)}
.health-badge.ok{background:rgba(63,185,80,0.15);color:var(--green);border:1px solid rgba(63,185,80,0.3)}
.health-badge.degraded{background:rgba(210,153,34,0.15);color:var(--yellow);border:1px solid rgba(210,153,34,0.3)}
.health-badge.stalled{background:rgba(248,81,73,0.15);color:var(--red);border:1px solid rgba(248,81,73,0.3)}
.health-rows{display:flex;flex-direction:column;gap:0.3rem}
.health-row{display:flex;justify-content:space-between;font-size:0.85rem}
.health-row .label{color:var(--text-secondary)}
.health-row .value{font-family:var(--font-mono);color:var(--text-primary)}

.node-row{font-size:0.8rem;color:var(--text-secondary);word-break:break-all;margin-bottom:0.35rem}
.node-row .mono{font-family:var(--font-mono);color:var(--text-primary);font-size:0.75rem}

.peer-list{list-style:none;display:flex;flex-direction:column;gap:0.35rem;max-height:200px;overflow-y:auto}
.peer-item{font-size:0.8rem;padding:0.3rem 0.5rem;background:var(--bg-surface);border-radius:4px;
  display:flex;flex-direction:column;gap:0.1rem}
.peer-name{color:var(--cyan);font-weight:500}
.peer-id{font-family:var(--font-mono);color:var(--text-muted);font-size:0.7rem}
.peer-empty{color:var(--text-muted);font-size:0.8rem;font-style:italic}

.filter-group{display:flex;flex-direction:column;gap:0.45rem}
.filter-group label{font-size:0.75rem;color:var(--text-secondary)}
.filter-group input,.filter-group select{
  background:var(--bg-surface);color:var(--text-primary);border:1px solid var(--border);
  border-radius:4px;padding:0.35rem 0.5rem;font-size:0.8rem;font-family:var(--font-mono);
  outline:none;width:100%}
.filter-group input:focus,.filter-group select:focus{border-color:var(--blue)}
.filter-group input::placeholder{color:var(--text-muted)}
.filter-actions{display:flex;gap:0.4rem;margin-top:0.2rem}
.btn{padding:0.3rem 0.7rem;border-radius:4px;border:1px solid var(--border);
  background:var(--bg-hover);color:var(--text-primary);cursor:pointer;font-size:0.8rem;
  transition:background 0.15s}
.btn:hover{background:var(--border)}
.btn-primary{background:rgba(88,166,255,0.15);border-color:rgba(88,166,255,0.3);color:var(--blue)}
.btn-primary:hover{background:rgba(88,166,255,0.25)}

.feed{padding:1rem;display:flex;flex-direction:column;overflow:hidden}
.feed-header{display:flex;align-items:center;gap:1rem;margin-bottom:0.75rem;flex-wrap:wrap}
.feed-header h2{font-size:1rem;font-weight:600}
.feed-counter{font-size:0.8rem;color:var(--text-secondary);font-family:var(--font-mono)}
.feed-controls{margin-left:auto;display:flex;gap:0.5rem;align-items:center}
.feed-controls label{font-size:0.8rem;color:var(--text-secondary);display:flex;align-items:center;gap:0.3rem}
.feed-items{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:0.5rem;padding-bottom:2rem}
.feed-empty{color:var(--text-muted);font-style:italic;text-align:center;padding:3rem 1rem}

.notif{background:var(--bg-card);border:1px solid var(--border);border-radius:8px;
  padding:0.75rem 0.85rem;animation:slideIn 0.25s ease-out;transition:border-color 0.15s}
.notif:hover{border-color:var(--border-light)}
@keyframes slideIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.notif-top{display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap;margin-bottom:0.35rem}
.sig-badge{font-size:0.65rem;font-weight:700;padding:0.1rem 0.45rem;border-radius:3px;
  font-family:var(--font-mono);text-transform:uppercase;flex-shrink:0}
.sig-badge.valid{background:rgba(63,185,80,0.15);color:var(--green);border:1px solid rgba(63,185,80,0.25)}
.sig-badge.unsigned{background:rgba(210,153,34,0.15);color:var(--yellow);border:1px solid rgba(210,153,34,0.25)}
.sig-badge.invalid{background:rgba(248,81,73,0.15);color:var(--red);border:1px solid rgba(248,81,73,0.25)}
.medium-badge,.reason-badge{font-size:0.7rem;padding:0.1rem 0.45rem;border-radius:3px;
  font-family:var(--font-mono);flex-shrink:0}
.medium-badge{background:rgba(188,140,255,0.12);color:var(--purple);border:1px solid rgba(188,140,255,0.2)}
.reason-badge{background:rgba(57,210,192,0.12);color:var(--cyan);border:1px solid rgba(57,210,192,0.2)}
.notif-time{font-size:0.75rem;color:var(--text-muted);margin-left:auto;font-family:var(--font-mono);flex-shrink:0}
.notif-sender{font-size:0.8rem;color:var(--text-secondary);margin-bottom:0.35rem}
.notif-sender .name{color:var(--cyan)}
.notif-sender .id{font-family:var(--font-mono);font-size:0.7rem;color:var(--text-muted)}
.notif-iris{margin-top:0.25rem}
.iris-toggle{font-size:0.75rem;color:var(--blue);cursor:pointer;background:none;border:none;
  font-family:var(--font-body);padding:0}
.iris-toggle:hover{text-decoration:underline}
.iris-list{list-style:none;margin-top:0.25rem;font-family:var(--font-mono);font-size:0.75rem}
.iris-list li{padding:0.15rem 0;color:var(--text-secondary);word-break:break-all;
  border-left:2px solid var(--border);padding-left:0.5rem;margin-left:0.15rem}
.iris-list li a{color:var(--blue)}

.scroll-anchor{display:flex;align-items:center;gap:0.3rem}
</style>
</head>
<body>
<header>
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="12" cy="12" r="3" fill="var(--green)"/>
      <path d="M12 2a10 10 0 0 1 10 10" stroke="var(--green)" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
      <path d="M12 5a7 7 0 0 1 7 7" stroke="var(--green)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
      <path d="M12 8a4 4 0 0 1 4 4" stroke="var(--green)" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
      <path d="M12 22a10 10 0 0 1-10-10" stroke="var(--green)" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
      <path d="M12 19a7 7 0 0 1-7-7" stroke="var(--green)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
      <path d="M12 16a4 4 0 0 1-4-4" stroke="var(--green)" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    </svg>
    <h1>Podping Gossip Watcher <span class="version" id="version"></span></h1>
  </div>
  <div class="header-meta">
    <div class="conn-status">
      <span class="conn-dot connecting" id="connDot"></span>
      <span id="connLabel">Connecting...</span>
    </div>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="panel">
      <div class="panel-title">Node Info</div>
      <div class="node-row">Name: <span class="mono" id="nodeName">-</span></div>
      <div class="node-row">ID: <span class="mono" id="nodeId">-</span></div>
      <div class="node-row">Pubkey: <span class="mono" id="nodePubkey">-</span></div>
    </div>

    <div class="panel">
      <div class="panel-title">Health</div>
      <div class="health-status">
        <span class="health-badge ok" id="healthBadge">--</span>
      </div>
      <div class="health-rows">
        <div class="health-row"><span class="label">Uptime</span><span class="value" id="uptime">-</span></div>
        <div class="health-row"><span class="label">Notifications</span><span class="value" id="totalNotifs">0</span></div>
        <div class="health-row"><span class="label">Failures</span><span class="value" id="totalFailures">0</span></div>
        <div class="health-row"><span class="label">Last Received</span><span class="value" id="lastNotif">-</span></div>
        <div class="health-row" id="archiveRow" style="display:none"><span class="label">Archive</span><span class="value" id="archiveCount">-</span></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">Peers (<span id="peerCount">0</span>)</div>
      <ul class="peer-list" id="peerList">
        <li class="peer-empty">Waiting for peers...</li>
      </ul>
      <div class="health-row" style="margin-top:0.5rem">
        <span class="label">Trusted Publishers</span>
        <span class="value" id="trustedCount">0</span>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">Filters</div>
      <div class="filter-group">
        <label>Medium</label>
        <input type="text" id="filterMedium" placeholder="e.g. podcast">
      </div>
      <div class="filter-group">
        <label>Reason</label>
        <input type="text" id="filterReason" placeholder="e.g. update">
      </div>
      <div class="filter-group">
        <label>Sender (prefix)</label>
        <input type="text" id="filterSender" placeholder="hex prefix...">
      </div>
      <div class="filter-actions">
        <button class="btn btn-primary" onclick="applyFilters()">Apply</button>
        <button class="btn" onclick="clearFilters()">Clear</button>
      </div>
    </div>
  </aside>

  <section class="feed">
    <div class="feed-header">
      <h2>Live Feed</h2>
      <span class="feed-counter" id="feedCounter">0 received this session</span>
      <div class="feed-controls">
        <label class="scroll-anchor">
          <input type="checkbox" id="autoScroll" checked> Auto-scroll
        </label>
      </div>
    </div>
    <div class="feed-items" id="feedItems">
      <div class="feed-empty" id="feedEmpty">Waiting for notifications...</div>
    </div>
  </section>
</div>

<script>
const MAX_FEED_ITEMS = 500;
let evtSource = null;
let sessionCount = 0;

function formatTimestamp(ts) {
  const d = new Date(ts * 1000);
  return d.toLocaleString();
}

function formatDuration(secs) {
  if (secs < 60) return secs + 's';
  if (secs < 3600) return Math.floor(secs / 60) + 'm ' + (secs % 60) + 's';
  const h = Math.floor(secs / 3600);
  const m = Math.floor((secs % 3600) / 60);
  return h + 'h ' + m + 'm';
}

function formatNumber(n) {
  return n.toLocaleString();
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function truncateId(id, len) {
  if (!id) return '-';
  if (id.length <= len) return id;
  return id.substring(0, len) + '...';
}

// Health polling
async function fetchHealth() {
  try {
    const r = await fetch('/api/health');
    if (!r.ok) return;
    const d = await r.json();
    const badge = document.getElementById('healthBadge');
    badge.textContent = d.status;
    badge.className = 'health-badge ' + d.status.toLowerCase();
    document.getElementById('uptime').textContent = formatDuration(d.uptime_seconds);
    document.getElementById('totalNotifs').textContent = formatNumber(d.notifications_received);
    document.getElementById('totalFailures').textContent = formatNumber(d.broadcast_failures);
    document.getElementById('lastNotif').textContent = d.seconds_since_last_notification === 0 ? 'just now' : formatDuration(d.seconds_since_last_notification) + ' ago';
    if (d.archive_messages !== null && d.archive_messages !== undefined) {
      document.getElementById('archiveRow').style.display = '';
      document.getElementById('archiveCount').textContent = formatNumber(d.archive_messages) + ' msgs';
    }
  } catch(e) {}
}

// Peers polling
async function fetchPeers() {
  try {
    const r = await fetch('/api/peers');
    if (!r.ok) return;
    const d = await r.json();
    const list = document.getElementById('peerList');
    document.getElementById('peerCount').textContent = d.peers.length;
    document.getElementById('trustedCount').textContent = d.trusted_publishers_count;
    if (d.peers.length === 0) {
      list.innerHTML = '<li class="peer-empty">No peers yet</li>';
    } else {
      list.innerHTML = d.peers.map(p =>
        '<li class="peer-item">' +
        (p.name ? '<span class="peer-name">' + escapeHtml(p.name) + '</span>' : '') +
        '<span class="peer-id">' + escapeHtml(truncateId(p.id, 24)) + '</span>' +
        '</li>'
      ).join('');
    }
  } catch(e) {}
}

// Node info (one-time)
async function fetchInfo() {
  try {
    const r = await fetch('/api/info');
    if (!r.ok) return;
    const d = await r.json();
    document.getElementById('version').textContent = 'v' + d.version;
    document.getElementById('nodeId').textContent = truncateId(d.node_id, 32);
    document.getElementById('nodeId').title = d.node_id;
    document.getElementById('nodePubkey').textContent = truncateId(d.pubkey, 32);
    document.getElementById('nodePubkey').title = d.pubkey;
    document.getElementById('nodeName').textContent = d.friendly_name || '(none)';
  } catch(e) {}
}

function addNotification(data) {
  const empty = document.getElementById('feedEmpty');
  if (empty) empty.remove();

  sessionCount++;
  document.getElementById('feedCounter').textContent = formatNumber(sessionCount) + ' received this session';

  const items = document.getElementById('feedItems');
  const el = document.createElement('div');
  el.className = 'notif';

  const sigClass = (data.sig_status || '').toLowerCase();
  const sigLabel = data.sig_status || 'UNKNOWN';

  let senderHtml = '';
  if (data.sender_name && data.sender_name !== data.sender && data.sender_name.length > 8) {
    senderHtml = '<span class="name">' + escapeHtml(data.sender_name) + '</span> ' +
                 '<span class="id">(' + escapeHtml(truncateId(data.sender, 16)) + ')</span>';
  } else {
    senderHtml = '<span class="id">' + escapeHtml(truncateId(data.sender, 16)) + '</span>';
  }

  const iris = data.iris || [];
  const irisCount = iris.length;
  const showExpanded = irisCount <= 3;
  const irisId = 'iris-' + sessionCount;

  let irisHtml = '';
  if (irisCount > 0) {
    irisHtml = '<div class="notif-iris">' +
      '<button class="iris-toggle" onclick="toggleIris(\'' + irisId + '\',this)">' +
      irisCount + ' IRI' + (irisCount !== 1 ? 's' : '') + (showExpanded ? ' &#9660;' : ' &#9654;') + '</button>' +
      '<ul class="iris-list" id="' + irisId + '" style="display:' + (showExpanded ? 'block' : 'none') + '">' +
      iris.map(u => '<li><a href="' + escapeHtml(u) + '" target="_blank" rel="noopener">' + escapeHtml(u) + '</a></li>').join('') +
      '</ul></div>';
  }

  el.innerHTML =
    '<div class="notif-top">' +
      '<span class="sig-badge ' + sigClass + '">' + escapeHtml(sigLabel) + '</span>' +
      '<span class="medium-badge">' + escapeHtml(data.medium || '-') + '</span>' +
      '<span class="reason-badge">' + escapeHtml(data.reason || '-') + '</span>' +
      '<span class="notif-time">' + (data.timestamp ? formatTimestamp(data.timestamp) : '') + '</span>' +
    '</div>' +
    '<div class="notif-sender">From: ' + senderHtml + '</div>' +
    irisHtml;

  items.prepend(el);

  // Trim old entries
  while (items.children.length > MAX_FEED_ITEMS) {
    items.removeChild(items.lastChild);
  }

  if (document.getElementById('autoScroll').checked) {
    items.scrollTop = 0;
  }
}

function toggleIris(id, btn) {
  const el = document.getElementById(id);
  if (!el) return;
  const showing = el.style.display !== 'none';
  el.style.display = showing ? 'none' : 'block';
  const text = btn.textContent.replace(/[▼▶]$/, '').trim();
  btn.innerHTML = text + (showing ? ' &#9654;' : ' &#9660;');
}

function getFilterParams() {
  const params = new URLSearchParams();
  const m = document.getElementById('filterMedium').value.trim();
  const r = document.getElementById('filterReason').value.trim();
  const s = document.getElementById('filterSender').value.trim();
  if (m) params.set('medium', m);
  if (r) params.set('reason', r);
  if (s) params.set('sender', s);
  return params.toString();
}

function connectSSE() {
  if (evtSource) {
    evtSource.close();
    evtSource = null;
  }

  const dot = document.getElementById('connDot');
  const label = document.getElementById('connLabel');
  dot.className = 'conn-dot connecting';
  label.textContent = 'Connecting...';

  const qs = getFilterParams();
  const url = '/events' + (qs ? '?' + qs : '');
  evtSource = new EventSource(url);

  evtSource.addEventListener('podping', function(e) {
    try {
      const data = JSON.parse(e.data);
      addNotification(data);
    } catch(err) {}
  });

  evtSource.onopen = function() {
    dot.className = 'conn-dot ok';
    label.textContent = 'Connected';
  };

  evtSource.onerror = function() {
    dot.className = 'conn-dot err';
    label.textContent = 'Disconnected';
  };
}

function applyFilters() {
  sessionCount = 0;
  document.getElementById('feedItems').innerHTML = '<div class="feed-empty" id="feedEmpty">Waiting for notifications...</div>';
  document.getElementById('feedCounter').textContent = '0 received this session';
  connectSSE();
}

function clearFilters() {
  document.getElementById('filterMedium').value = '';
  document.getElementById('filterReason').value = '';
  document.getElementById('filterSender').value = '';
  applyFilters();
}

// Enter key applies filters
document.querySelectorAll('.filter-group input').forEach(function(el) {
  el.addEventListener('keydown', function(e) { if (e.key === 'Enter') applyFilters(); });
});

// Bootstrap
fetchInfo();
fetchHealth();
fetchPeers();
connectSSE();

setInterval(fetchHealth, 5000);
setInterval(fetchPeers, 15000);
</script>
</body>
</html>
